<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Fotos - Click On</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], },
                    colors: { brand: { 50: '#f0f9ff', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e', } }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-800">

    <!-- Navegação simplificada do Dashboard -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center cursor-pointer" onclick="window.location.href='index.html'">
                    <div class="w-10 h-10 bg-gradient-to-br from-brand-500 to-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                        <i class="fa-solid fa-camera-retro text-xl"></i>
                    </div>
                    <span class="ml-3 font-bold text-2xl tracking-tight text-brand-900">Click On</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="fazerLogout()" class="text-slate-500 hover:text-red-500 font-medium transition-colors flex items-center">
                        <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow bg-slate-50 py-8 fade-in">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <!-- Cabeçalho -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 mb-8 flex flex-col sm:flex-row justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900">Olá, Visitante! 👋</h2>
                    <p class="text-slate-500 mt-1">Aqui estão as fotos da sua diversão.</p>
                </div>
            </div>

            <!-- Galeria Dinâmica -->
            <div id="galeria-fotos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- As fotos serão inseridas aqui via JavaScript -->
            </div>
            
        </div>
    </main>

    <!-- Footer Simples -->
    <footer class="bg-slate-900 py-6 border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-sm text-slate-400">&copy; 2026 Click On. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Lógica do Dashboard -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Pega os dados salvos durante o login
            const fotosSalvas = localStorage.getItem('fotos_cliente');
            
            // 2. Proteção de Rota: Se não houver fotos salvas, significa que o usuário não logou
            if (!fotosSalvas) {
                window.location.href = 'index.html'; // Mude para o nome exato da sua tela de login
                return;
            }

            // 3. Converte o texto de volta para uma lista do JavaScript (Array)
            const arrayDeFotos = JSON.parse(fotosSalvas);
            const containerGaleria = document.getElementById('galeria-fotos');

            // 4. Se a lista estiver vazia
            if(arrayDeFotos.length === 0) {
                containerGaleria.innerHTML = `<p class="text-slate-500 col-span-full text-center py-10">Nenhuma foto encontrada no seu pacote.</p>`;
                return;
            }

            // 5. Gera um cartão HTML para cada foto retornada pela API
            arrayDeFotos.forEach((urlDaFoto, index) => {
                const codigoFicticio = `#AQ-${Math.floor(1000 + Math.random() * 9000)}-${String.fromCharCode(65 + index)}`;
                
                const cartaoHtml = `
                    <div class="bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 group border border-slate-100">
                        <div class="relative aspect-w-4 aspect-h-3 h-64 overflow-hidden bg-slate-100">
                            <img src="${urlDaFoto}" alt="Sua foto no parque" class="object-cover w-full h-full transform group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute top-3 right-3 bg-white/90 backdrop-blur rounded-full px-2 py-1 text-xs font-bold text-slate-700 shadow">
                                Alta Res
                            </div>
                        </div>
                        <div class="p-4 flex justify-between items-center">
                            <span class="text-xs text-slate-500 font-medium">${codigoFicticio}</span>
                            <a href="${urlDaFoto}" target="_blank" download="ClickOn_Foto_${index+1}.jpg" class="text-brand-600 hover:text-white border border-brand-600 hover:bg-brand-600 rounded-full w-8 h-8 flex items-center justify-center transition-colors tooltip">
                                <i class="fa-solid fa-download"></i>
                            </a>
                        </div>
                    </div>
                `;
                
                containerGaleria.innerHTML += cartaoHtml;
            });
        });

        // Função de Sair
        function fazerLogout() {
            // Limpa as credenciais e fotos da memória do navegador
            localStorage.removeItem('fotos_cliente');
            // Manda de volta pra home
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
